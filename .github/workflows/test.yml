name: Sensor tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  sensor-tests:
    name: HA ${{ matrix.homeassistant }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.12.5"
            python: "3.12"
          - homeassistant: "2026.10.4"
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install homeassistant==${{ matrix.homeassistant }} pymodbus==3.7.4 pytest==9.1.1
      - run: python -m pytest tests/ -q

  dashboard-tests:
    name: Dashboard discovery and passive interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

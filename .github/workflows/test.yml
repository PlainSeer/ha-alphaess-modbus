name: Sensor tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  sensor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install homeassistant==2024.12.5 pymodbus==3.7.4 pytest==9.1.1
      - run: python -m pytest tests/test_filtered_power.py -q

name: Stable release

on:
  push:
    branches: [main]
    paths:
      - custom_components/alphaess_modbus/manifest.json
      - .github/release-notes/v*.md

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            ha: "2024.12.5"
          - python: "3.14"
            ha: "2026.10.4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install homeassistant==${{ matrix.ha }} pymodbus==3.7.4 pytest==9.1.1
      - run: python -m pytest tests/ -q
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
  release:
    needs: [python-tests, frontend-tests, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check stable version and existing release
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('custom_components/alphaess_modbus/manifest.json')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setOutput('publish', 'false');
              return;
            }
            const tag = `v${version}`;
            if (!fs.existsSync(`.github/release-notes/${tag}.md`)) throw new Error('Missing release notes');
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              core.setOutput('publish', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }
            core.setOutput('tag', tag);
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }} — AlphaESS dashboard
          prerelease: false
          make_latest: true
          body_path: .github/release-notes/${{ steps.version.outputs.tag }}.md

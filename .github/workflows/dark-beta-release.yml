name: Dark dashboard beta release

on:
  push:
    branches: [beta-dark-dashboard]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            ha: "2024.12.5"
          - python: "3.14"
            ha: "2026.10.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install homeassistant==${{ matrix.ha }} pymodbus==3.7.4 pytest==9.1.1
      - run: python -m pytest tests/ -q
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  release:
    needs: [python-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('custom_components/alphaess_modbus/manifest.json'));if(m.version!=='1.19.3b5')process.exit(1)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.19.3b5
          target_commitish: ${{ github.sha }}
          name: v1.19.3b5 — Landscape dashboard layout fix
          prerelease: true
          make_latest: false
          body_path: .github/release-notes/v1.19.3b5.md
